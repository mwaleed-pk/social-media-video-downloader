[program:fastsave]
command=/home/ubuntu/fastsave/venv/bin/gunicorn -w 4 -b 0.0.0.0:5000 --timeout 300 --access-logfile - --error-logfile - app:app
directory=/home/ubuntu/fastsave/backend
user=ubuntu
autostart=true
autorestart=true
stderr_logfile=/var/log/fastsave/err.log
stdout_logfile=/var/log/fastsave/out.log
environment=PORT=5000,DEBUG=false
